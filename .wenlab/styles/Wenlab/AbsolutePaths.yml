extends: existence
message: "发现绝对路径写法“%s”；项目文件请改用相对路径，必要的系统路径或教学反例需用局部例外说明。"
level: error
# raw: also scan link targets, inline code, code blocks and frontmatter.
scope: raw
ignorecase: true
nonword: true
# Each match runs to the next space, quote, bracket, table pipe or CJK punctuation so the message shows the whole path.
tokens:
  # Windows drive letter, e.g. C:\ or D:/
  - '(?<=^|[\s\u3000\x60\x22\x27(<\[={（【《「『“‘：，、；。！？])[A-Za-z]:[\\/][^\s\u3000\x60\x22\x27)\]>|（）【】《》「」『』“”‘’，、；。！？]*'
  # file:// URI
  - '\bfile://[^\s\u3000\x60\x22\x27)\]>|（）【】《》「」『』“”‘’，、；。！？]*'
  # UNC path, e.g. \\server\share\
  - '(?<=^|[\s\u3000\x60\x22\x27(<\[={（【《「『“‘：，、；。！？])\\\\[^\\\s]+\\[^\s\u3000\x60\x22\x27)\]>|（）【】《》「」『』“”‘’，、；。！？]*'
  # Unix absolute or root-relative path; "<" is excluded so HTML closing tags such as </a> do not match.
  # A single segment without an extension (/help, /quiet, /p:Value) is a command switch, not a path.
  - '(?<=^|[\s\u3000\x60\x22\x27(\[={（【《「『“‘：，、；。！？])/(?![A-Za-z0-9_-]+(?:$|[\s\u3000\x60\x22\x27)\]>|（）【】《》「」『』“”‘’，、；。！？]|[.,;!?](?:$|[\s\u3000])|:(?![\\/])))[A-Za-z0-9_~.-][^\s\u3000\x60\x22\x27)\]>|（）【】《》「」『』“”‘’，、；。！？]*'
