extends: script
message: "标题重名：“%s”与同一上级下的另一个标题或其直接上级标题同名；请改用能区分内容的标题。"
level: error
scope: raw
# Replaces rumdl MD024 (siblings only) and also reports a heading that repeats its direct parent.
# Only ATX headings are parsed; frontmatter and fenced code blocks are skipped.
script: |
  text := import("text")
  headings := []
  lines := text.split(scope, "\n")
  pos := 0
  fence := ""
  front := false
  for i, raw in lines {
    line := text.trim_suffix(raw, "\r")
    start := pos
    pos += len(raw) + 1
    if i == 0 && line == "---" { front = true; continue }
    if front {
      if line == "---" || line == "..." { front = false }
      continue
    }
    marker := text.re_find("^ {0,3}(`{3,}|~{3,})", line)
    if marker != undefined {
      ch := marker[0][1].text[0:1]
      if fence == "" { fence = ch } else if ch == fence { fence = "" }
      continue
    }
    if fence != "" { continue }
    m := text.re_find("^ {0,3}(#{1,6})(?:[ \t]+(.*?))?[ \t]*$", line)
    if m == undefined { continue }
    title := text.trim_space(text.re_replace("(^|[ \t]+)#+$", m[0][2].text, ""))
    headings = append(headings, {level: len(m[0][1].text), title: title, begin: start, end: start + len(line)})
  }
  parents := []
  stack := []
  for i, h in headings {
    for len(stack) > 0 && headings[stack[len(stack)-1]].level >= h.level { stack = stack[:len(stack)-1] }
    parents = append(parents, len(stack) > 0 ? stack[len(stack)-1] : -1)
    stack = append(stack, i)
  }
  matches := []
  seen := {}
  for i, h in headings {
    p := parents[i]
    key := string(p) + "|" + h.title
    duplicate := seen[key] != undefined
    seen[key] = true
    if p >= 0 && headings[p].title == h.title { duplicate = true }
    if duplicate { matches = append(matches, {begin: h.begin, end: h.end}) }
  }
