extends: script
message: "标题层级过深：“%s”；最多使用三级标题，三级标题下的并列内容请改用列表。"
level: error
scope: raw
# Only ATX headings are parsed; frontmatter and fenced code blocks are skipped.
script: |
  text := import("text")
  matches := []
  lines := text.split(scope, "\n")
  pos := 0
  fence := ""
  front := false
  for i, raw in lines {
    line := text.trim_suffix(raw, "\r")
    start := pos
    pos += len(raw) + 1
    if i == 0 && line == "---" { front = true; continue }
    if front {
      if line == "---" || line == "..." { front = false }
      continue
    }
    marker := text.re_find("^ {0,3}(`{3,}|~{3,})", line)
    if marker != undefined {
      ch := marker[0][1].text[0:1]
      if fence == "" { fence = ch } else if ch == fence { fence = "" }
      continue
    }
    if fence != "" { continue }
    if text.re_match("^ {0,3}#{4,6}([ \t]|$)", line) { matches = append(matches, {begin: start, end: start + len(line)}) }
  }
